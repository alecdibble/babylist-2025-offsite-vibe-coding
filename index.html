<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Babylist Stroller Stroll">
    <title>Stroller Dash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fadaf3;
        }
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fadaf3;
            z-index: 200;
        }
        #splash-screen img {
            max-width: 80%;
            max-height: 60%;
        }
        #splash-screen p {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        #audio-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
        }
        #mute-btn {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #mute-btn.muted {
            background-color: #f44336;
        }
        canvas {
            border: 2px solid #000;
            max-width: 100%;
        }
        #game-container {
            position: relative;
        }
        #power-up-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background-color: rgba(255, 215, 0, 0.7);
            border-radius: 5px;
            font-weight: bold;
            display: none;
        }
        #score {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            display: none;
        }
        #restart-btn {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #restart-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <img src="splash.png" alt="Stroller Sprint Splash">
        <p>Click Anywhere To Start</p>
    </div>
    <h1>Stroller Sprint</h1>
    <div id="audio-controls">
        <button id="mute-btn">Mute Music</button>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="power-up-indicator">INVINCIBLE: <span id="countdown">3</span></div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Your score: <span id="final-score">0</span></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>
    <div id="score">Score: 0</div>
    
    <script src="game.js"></script>
    <script>
        // Audio control functionality
        const muteButton = document.getElementById('mute-btn');
        
        muteButton.addEventListener('click', function() {
            // Access the background music from the game.js
            if (backgroundMusic) {
                if (backgroundMusic.paused) {
                    backgroundMusic.play();
                    muteButton.textContent = 'Mute Music';
                    muteButton.classList.remove('muted');
                } else {
                    backgroundMusic.pause();
                    muteButton.textContent = 'Play Music';
                    muteButton.classList.add('muted');
                }
            }
        });
    </script>
</body>
</html>
